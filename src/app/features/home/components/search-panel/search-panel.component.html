<div class="search-panel-container">
  <form [formGroup]="searchForm" (ngSubmit)="onSubmit()" class="search-form" role="search" aria-label="Restaurant table search">
    
    <!-- Location Control -->
    <div class="form-field">
      <label for="searchLocation" class="field-label">
        <svg viewBox="0 0 20 20" fill="currentColor" class="field-icon" aria-hidden="true">
          <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd" />
        </svg>
        <span>Location</span>
      </label>
      <div class="select-wrapper">
        <select id="searchLocation" formControlName="location" class="form-select">
          @for (loc of locations; track loc.value) {
            <option [value]="loc.value">{{ loc.label }}</option>
          }
        </select>
        <span class="chevron-down" aria-hidden="true">▾</span>
      </div>
    </div>

    <!-- Cuisine Control -->
    <div class="form-field">
      <label for="searchCuisine" class="field-label">
        <svg viewBox="0 0 20 20" fill="currentColor" class="field-icon" aria-hidden="true">
          <path d="M5 4a1 1 0 00-2 0v7.268a2 2 0 000 3.464V16a1 1 0 102 0v-1.268a2 2 0 000-3.464V4zM11 4a1 1 0 10-2 0v1.268a2 2 0 000 3.464V16a1 1 0 102 0V8.732a2 2 0 000-3.464V4zM16 3a1 1 0 011 1v7.268a2 2 0 010 3.464V16a1 1 0 11-2 0v-1.268a2 2 0 010-3.464V4a1 1 0 011-1z" />
        </svg>
        <span>Cuisine</span>
      </label>
      <div class="select-wrapper">
        <select id="searchCuisine" formControlName="cuisine" class="form-select">
          @for (c of cuisines; track c.value) {
            <option [value]="c.value">{{ c.label }}</option>
          }
        </select>
        <span class="chevron-down" aria-hidden="true">▾</span>
      </div>
    </div>

    <!-- Date Picker (min date enforced) -->
    <div class="form-field">
      <label for="searchDate" class="field-label">
        <svg viewBox="0 0 20 20" fill="currentColor" class="field-icon" aria-hidden="true">
          <path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd" />
        </svg>
        <span>Date</span>
      </label>
      <input 
        id="searchDate"
        type="date" 
        [min]="minDate" 
        formControlName="date" 
        class="form-input date-input"
        aria-describedby="date-help"
      />
      <span id="date-help" class="sr-only">Select your desired reservation date</span>
    </div>

    <!-- Time Slot Picker -->
    <div class="form-field">
      <label for="searchTime" class="field-label">
        <svg viewBox="0 0 20 20" fill="currentColor" class="field-icon" aria-hidden="true">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd" />
        </svg>
        <span>Time</span>
      </label>
      <div class="select-wrapper">
        <select id="searchTime" formControlName="time" class="form-select">
          @for (slot of timeSlots; track slot) {
            <option [value]="slot">{{ slot }}</option>
          }
        </select>
        <span class="chevron-down" aria-hidden="true">▾</span>
      </div>
    </div>

    <!-- Guests Selection -->
    <div class="form-field">
      <label for="searchGuests" class="field-label">
        <svg viewBox="0 0 20 20" fill="currentColor" class="field-icon" aria-hidden="true">
          <path d="M9 6a3 3 0 11-6 0 3 3 0 016 0zM17 6a3 3 0 11-6 0 3 3 0 016 0zM12.93 17c.046-.327.07-.66.07-1a6.97 6.97 0 00-1.5-4.33A5 5 0 0119 16v1h-6.07zM6 11a5 5 0 015 5v1H1v-1a5 5 0 015-5z" />
        </svg>
        <span>Party Size</span>
      </label>
      <div class="select-wrapper">
        <select id="searchGuests" formControlName="guests" class="form-select">
          @for (g of guestOptions; track g.value) {
            <option [value]="g.value">{{ g.label }}</option>
          }
        </select>
        <span class="chevron-down" aria-hidden="true">▾</span>
      </div>
    </div>

    <!-- Submit Button -->
    <div class="form-action">
      <button type="submit" class="btn btn-terracotta search-submit-btn" aria-label="Search available tables">
        <svg viewBox="0 0 20 20" fill="currentColor" class="search-btn-icon" aria-hidden="true">
          <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
        </svg>
        <span>Find Table</span>
      </button>
    </div>
  </form>
</div>
