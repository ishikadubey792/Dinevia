<div 
  class="restaurants-error-card" 
  [class.error-banner]="variant === 'banner'"
  [class.error-inline]="variant === 'inline'"
  [ngClass]="containerClass"
  role="alert">
  <div class="error-icon-wrap" aria-hidden="true">
    <svg viewBox="0 0 20 20" fill="currentColor" class="error-svg">
      <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
    </svg>
  </div>
  <div class="error-content">
    <h3 class="error-title">{{ title }}</h3>
    <p class="error-message">{{ message }}</p>
  </div>
  @if (showRetry) {
    <button type="button" class="btn btn-outline btn-sm retry-button retry-btn" (click)="onRetryClick()">
      {{ retryLabel }}
    </button>
  }
</div>
